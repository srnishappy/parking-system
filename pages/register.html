<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก — จอดตรงไหน @ มหาวิทยาลัยวลัยลักษณ์</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../components/AuthLayout.css">
</head>
<body>
<div id="toast-container"></div>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-brand">
      <a href="../index.html" class="auth-logo">
        <span class="mark">P</span>จอดตรงไหน
      </a>
      <h1 class="auth-title">สมัครสมาชิกใหม่</h1>
      <p class="auth-subtitle">สร้างบัญชีสำหรับใช้งานระบบแนะนำที่จอดรถ มวล.</p>
    </div>

    <div id="alertContainer"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="regName">ชื่อ - นามสกุล</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="regName" class="form-control" placeholder="ชื่อ นามสกุล" autocomplete="name" required>
        </div>
        <div class="field-error" id="nameError" style="display:none;"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">อีเมล</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" autocomplete="email" required>
        </div>
        <div class="field-error" id="emailError" style="display:none;"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">รหัสผ่าน</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="regPassword" class="form-control" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password" required>
          <button type="button" class="toggle-password" id="toggleReg" aria-label="แสดง/ซ่อน">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="passwordError" style="display:none;"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regConfirm">ยืนยันรหัสผ่าน</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="regConfirm" class="form-control" placeholder="พิมพ์รหัสผ่านซ้ำอีกครั้ง" autocomplete="new-password" required>
          <button type="button" class="toggle-password" id="toggleCon" aria-label="แสดง/ซ่อน">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="confirmError" style="display:none;"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="regBtn" style="width:100%;margin-top:8px;">
        ลงทะเบียนสมาชิก
      </button>
    </form>

    <div class="auth-switch">
      มีบัญชีอยู่แล้ว? <a href="./login.html">เข้าสู่ระบบ</a>
    </div>
  </div>

  <a href="../index.html" class="back-home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    กลับหน้าหลัก
  </a>
</div>

<script src="../utils/auth.js"></script>
<script src="../components/ProtectedRoute.js"></script>
<script src="../components/AuthLayout.js"></script>
<script>
  ProtectedRoute.guard({ requireAuth: false });

  AuthLayout.setupPasswordToggle('regPassword', 'toggleReg');
  AuthLayout.setupPasswordToggle('regConfirm', 'toggleCon');

  const nameEl  = document.getElementById('regName');
  const emailEl = document.getElementById('regEmail');
  const passEl  = document.getElementById('regPassword');
  const conEl   = document.getElementById('regConfirm');
  const nameErr = document.getElementById('nameError');
  const emailErr= document.getElementById('emailError');
  const passErr = document.getElementById('passwordError');
  const conErr  = document.getElementById('confirmError');
  const regBtn  = document.getElementById('regBtn');

  function clearErrors() {
    [nameErr,emailErr,passErr,conErr].forEach(e => e.style.display='none');
    [nameEl,emailEl,passEl,conEl].forEach(e => e.classList.remove('is-invalid'));
    AuthLayout.showAlert('alertContainer',null,null);
  }

  function validate() {
    clearErrors(); let ok=true;
    if (!nameEl.value.trim()) { nameErr.textContent='กรุณากรอกชื่อ'; nameErr.style.display='flex'; nameEl.classList.add('is-invalid'); ok=false; }
    if (!emailEl.value.trim()) { emailErr.textContent='กรุณากรอกอีเมล'; emailErr.style.display='flex'; emailEl.classList.add('is-invalid'); ok=false; }
    else if (!authService.isValidEmail(emailEl.value)) { emailErr.textContent='รูปแบบอีเมลไม่ถูกต้อง'; emailErr.style.display='flex'; emailEl.classList.add('is-invalid'); ok=false; }
    if (!authService.isValidPassword(passEl.value)) { passErr.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'; passErr.style.display='flex'; passEl.classList.add('is-invalid'); ok=false; }
    if (passEl.value !== conEl.value) { conErr.textContent='รหัสผ่านไม่ตรงกัน'; conErr.style.display='flex'; conEl.classList.add('is-invalid'); ok=false; }
    return ok;
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validate()) return;
    AuthLayout.setButtonLoading(regBtn, true, 'ลงทะเบียนสมาชิก');

    const res = await authService.register({
      name: nameEl.value, email: emailEl.value,
      password: passEl.value, confirmPassword: conEl.value
    });

    if (res.success) {
      AuthLayout.showAlert('alertContainer', 'success', res.message);
      setTimeout(() => { window.location.href = './login.html'; }, 1200);
    } else {
      AuthLayout.setButtonLoading(regBtn, false, 'ลงทะเบียนสมาชิก');
      AuthLayout.showAlert('alertContainer', 'error', res.message);
    }
  });
</script>
</body>
</html>
