<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — จอดตรงไหน @ มหาวิทยาลัยวลัยลักษณ์</title>
  <meta name="description" content="Smart Parking Recommendation — Walailak University">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- ── HEADER ─────────────────────────────────────────────────────────────── -->
<header>
  <div class="nav">
    <a href="./dashboard.html" class="logo">
      <span class="mark">P</span>
      <span>จอดตรงไหน</span>
    </a>

    <nav class="nav-links">
      <a href="./dashboard.html" class="active">แนะนำที่จอดรถ</a>
      <a href="./report-issue.html">แจ้งปัญหา</a>
      <a href="./my-tickets.html">Ticket ของฉัน</a>
      <a href="./profile.html">ข้อมูลส่วนตัว</a>
      <a href="./settings.html">ตั้งค่า</a>
    </nav>

    <div class="user-nav">
      <div class="user-pill">
        <div class="user-avatar" id="navAvatar">U</div>
        <span id="navName">ผู้ใช้งาน</span>
      </div>
      <button class="logout-btn" id="logoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        ออกจากระบบ
      </button>
    </div>
  </div>
</header>

<!-- ── MAIN ───────────────────────────────────────────────────────────────── -->
<main class="dashboard">

  <!-- 1. Welcome Card -->
  <div class="welcome-card" id="welcomeCard">
    <div class="welcome-info">
      <div id="roleBadge"></div>
      <h1 class="welcome-name" id="welcomeName">กำลังโหลด...</h1>
      <div class="welcome-sub" id="welcomeSub">มหาวิทยาลัยวลัยลักษณ์</div>
      <div class="welcome-detail" id="welcomeDetail"></div>
    </div>
    <div id="welcomeExtra" style="flex-shrink:0;display:flex;flex-direction:column;gap:8px;align-self:center;">
      <a href="./report-issue.html" class="btn btn-primary" style="font-size:13.5px;padding:8px 16px;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        แจ้งปัญหา / Report Issue
      </a>
      <a href="./my-tickets.html" class="btn btn-ghost" style="font-size:13.5px;padding:8px 16px;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        ดู Ticket ของฉัน
      </a>
    </div>
  </div>

  <!-- 2. Context Panel (class schedule / office / location) -->
  <div class="context-panel" id="contextPanel" style="display:none;"></div>

  <!-- 3. Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาอาคาร หรือ ลานจอดรถ..." autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="ล้างการค้นหา">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="search-dropdown" id="searchDropdown" style="display:none;"></div>
  </div>

  <!-- 4. Recommendation Section -->
  <div class="rec-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
    <div>
      <div class="rec-title" id="recTitle">ที่จอดรถแนะนำสำหรับคุณ</div>
      <div style="font-size:12.5px;color:var(--slate);display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
        <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--go-green);box-shadow:0 0 8px var(--go-green);"></span>
        <span>ข้อมูลเซนเซอร์อัปเดตเรียลไทม์ทุก 1 นาที</span>
        <span style="color:var(--asphalt-line);">|</span>
        <span>อัปเดตล่าสุดเมื่อ: <b id="lastUpdatedTime" style="color:var(--road-yellow);font-family:var(--font-mono);">—</b></span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button type="button" id="manualRefreshBtn" class="btn btn-ghost" style="padding:6px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        รีเฟรชข้อมูล
      </button>
      <div id="recBadge"></div>
    </div>
  </div>

  <div class="rec-reason-box" id="recReasonBox" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="recReason"></span>
  </div>

  <!-- Loading State -->
  <div class="rec-loading" id="recLoading">
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  </div>

  <!-- Cards Grid -->
  <div class="p-cards-grid" id="cardsGrid" style="display:none;"></div>

  <!-- All Lots Section (Search results / Guest full list) -->
  <div id="allLotsSection" style="display:none;margin-top:40px;">
    <div class="rec-header" style="margin-bottom:16px;">
      <div class="rec-title" style="font-size:22px;" id="allLotsTitle">ลานจอดรถทั้งหมด</div>
    </div>
    <div class="p-cards-grid" id="allLotsGrid"></div>
  </div>

</main>

<footer>
  จอดตรงไหน · Smart Parking System 
</footer>

<!-- ── SCRIPTS ─────────────────────────────────────────────────────────────── -->
<script src="../utils/auth.js"></script>
<script src="../api/parkingApi.js"></script>
<script src="../utils/parkingData.js"></script>
<script src="../mock/parkingPredictionData.js"></script>
<script src="../api/parkingPredictionApi.js"></script>
<script src="../utils/recommendationEngine.js"></script>
<script src="../components/ProtectedRoute.js"></script>
<script src="../components/ParkingCard.js"></script>

<script>
// ─── Toast Helper ────────────────────────────────────────────────────────────
function showToast(msg, type = 'default') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.innerHTML = `<span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => {
    t.classList.add('toast-out');
    setTimeout(() => t.remove(), 300);
  }, 4000);
}

// ─── Route Guard ─────────────────────────────────────────────────────────────
ProtectedRoute.guard({ requireAuth: true });
const user = ProtectedRoute.getUser();

// ─── Role Configuration ───────────────────────────────────────────────────────
const ROLE_CONFIG = {
  student: {
    label:     'นักศึกษา',
    badgeClass: 'role-student',
    emoji:     '🎓',
    color:     'var(--blue)',
  },
  staff: {
    label:     'บุคลากร / อาจารย์',
    badgeClass: 'role-staff',
    emoji:     '👔',
    color:     'var(--go-green)',
  },
  guest: {
    label:     'บุคคลภายนอก',
    badgeClass: 'role-guest',
    emoji:     '🏢',
    color:     'var(--road-yellow)',
  },
};

const roleCfg = ROLE_CONFIG[user.role] || ROLE_CONFIG.guest;

// ─── Populate Header ──────────────────────────────────────────────────────────
document.getElementById('navAvatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
document.getElementById('navName').textContent   = user.name;

// ─── Populate Welcome Card ────────────────────────────────────────────────────
document.getElementById('roleBadge').innerHTML = `
  <span class="role-badge ${roleCfg.badgeClass}" style="margin-bottom:8px;">
    ${roleCfg.emoji} ${roleCfg.label}
  </span>`;
document.getElementById('welcomeName').textContent = `สวัสดี, ${user.name}`;

const details = [];
if (user.role === 'student') {
  document.getElementById('welcomeSub').textContent = `${user.faculty} · รหัส ${user.studentId}`;
  details.push({ icon: '🎓', label: 'สำนักวิชา', value: user.faculty });
  details.push({ icon: '🪪', label: 'รหัสนักศึกษา', value: user.studentId });
} else if (user.role === 'staff') {
  document.getElementById('welcomeSub').textContent = `${user.department} · ${user.position}`;
  details.push({ icon: '🏢', label: 'หน่วยงาน', value: user.department });
  details.push({ icon: '📍', label: 'อาคารสำนักงาน', value: user.officeBuilding });
} else {
  document.getElementById('welcomeSub').textContent = 'บุคคลภายนอก · ไม่มีข้อมูลสังกัด';
  details.push({ icon: '📧', label: 'อีเมล', value: user.email });
}
details.push({ icon: '📱', label: 'โทร', value: user.phone || '—' });

document.getElementById('welcomeDetail').innerHTML = details.map(d => `
  <div class="welcome-detail-item">
    <span>${d.icon}</span>
    <span><b>${d.label}:</b> ${d.value}</span>
  </div>
`).join('');

// ─── Context Panel ────────────────────────────────────────────────────────────
const ctxPanel = document.getElementById('contextPanel');

function buildStudentContextPanel(currentClass) {
  if (!currentClass || !user.schedule) { ctxPanel.style.display = 'none'; return; }

  const days     = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const todayIdx = new Date().getDay();

  // Build rows — today's schedule
  const todayClasses = user.schedule.filter(c => c.day === todayIdx);
  const curMins      = new Date().getHours() * 60 + new Date().getMinutes();

  const rows = todayClasses.map(c => {
    const start = c.startHour * 60 + c.startMin;
    const end   = c.endHour   * 60 + c.endMin;
    const isNow = curMins >= start && curMins < end;
    return `
      <div class="class-row${isNow ? ' active-class' : ''}">
        <div class="class-time">${String(c.startHour).padStart(2,'0')}:${String(c.startMin).padStart(2,'0')} – ${String(c.endHour).padStart(2,'0')}:${String(c.endMin).padStart(2,'0')}</div>
        <div class="class-building">${c.building}</div>
        ${isNow ? '<span class="active-label">● กำลังเรียน</span>' : ''}
      </div>`;
  }).join('') || `<div style="color:var(--slate);font-size:14px;padding:8px 0;">ไม่มีตารางเรียนในวันนี้</div>`;

  ctxPanel.style.display = 'block';
  ctxPanel.innerHTML = `
    <div class="context-panel-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ตารางเรียนวัน${days[todayIdx]}นี้
      ${currentClass ? `<span class="class-day">→ ${currentClass.building}</span>` : ''}
    </div>
    ${rows}
  `;
}

function buildStaffContextPanel() {
  ctxPanel.style.display = 'block';
  ctxPanel.innerHTML = `
    <div class="context-panel-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      อาคารสำนักงาน
    </div>
    <div class="class-row">
      <div class="class-time">⏰ จ–ศ</div>
      <div class="class-building">${user.officeBuilding}</div>
      <span class="active-label" style="background:var(--go-green-dim);color:var(--go-green);">● ทำงานอยู่</span>
    </div>
    <div style="margin-top:10px;font-size:13px;color:var(--slate);">
      หน่วยงาน: <b style="color:var(--concrete);">${user.department}</b> &nbsp;|&nbsp; ตำแหน่ง: <b style="color:var(--concrete);">${user.position}</b>
    </div>
  `;
}

function buildGuestContextPanel(location, isMock) {
  ctxPanel.style.display = 'block';
  ctxPanel.innerHTML = `
    <div class="context-panel-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      ตำแหน่งของคุณ
      ${isMock ? '<span class="class-day" style="background:var(--road-yellow-dim);color:var(--road-yellow);">Mock Location</span>' : '<span class="class-day" style="background:var(--go-green-dim);color:var(--go-green);">GPS จริง</span>'}
    </div>
    <div class="class-row" style="align-items:center;gap:16px;">
      <div class="location-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${isMock ? 'ประตูทางเข้าหลัก มวล.' : `${location.lat.toFixed(5)}, ${location.lng.toFixed(5)}`}
      </div>
      <button class="location-btn" id="useGpsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        ใช้ตำแหน่งของฉัน (GPS)
      </button>
    </div>
    ${isMock ? `<div style="margin-top:10px;font-size:12.5px;color:var(--slate);">กำลังใช้ Mock Location ที่ประตูทางเข้าหลักมหาวิทยาลัย · กดปุ่ม "ใช้ตำแหน่งของฉัน" เพื่อรับคำแนะนำที่แม่นยำขึ้น</div>` : ''}
  `;

  // GPS button handler
  document.getElementById('useGpsBtn')?.addEventListener('click', () => {
    if (!navigator.geolocation) {
      showToast('เบราว์เซอร์นี้ไม่รองรับ Geolocation', 'error');
      return;
    }
    showToast('🛰️ กำลังระบุตำแหน่ง GPS...', 'info');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        showToast(`📍 ระบุตำแหน่งสำเร็จ: ${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}`, 'success');
        buildGuestContextPanel(loc, false);
        loadRecommendations(loc);
      },
      () => {
        showToast('ไม่สามารถระบุตำแหน่งได้ ใช้ Mock Location แทน', 'error');
      }
    );
  });
}

// ─── Load & Render Recommendations ───────────────────────────────────────────
async function loadRecommendations(guestLocation = null) {
  document.getElementById('recLoading').style.display  = 'flex';
  document.getElementById('cardsGrid').style.display   = 'none';
  document.getElementById('recReasonBox').style.display = 'none';

  const result = await RecommendationEngine.getRecommendations(user, guestLocation);

  // Context panel
  if (user.role === 'student') {
    const cls = RecommendationEngine.getCurrentOrNextClass(user.schedule);
    buildStudentContextPanel(cls);
  } else if (user.role === 'staff') {
    buildStaffContextPanel();
  } else {
    buildGuestContextPanel(result.context, result.context.isMock);
  }

  // Reason box
  document.getElementById('recReason').textContent = result.reason;
  document.getElementById('recReasonBox').style.display = 'flex';

  // Render cards
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  result.lots.forEach((lot, idx) => {
    grid.appendChild(ParkingCard.create(lot, idx + 1, true));
  });

  document.getElementById('recLoading').style.display = 'none';
  grid.style.display = 'grid';

  // Toast
  const total = result.lots.length;
  showToast(`✅ พบที่จอดรถที่แนะนำ ${total} แห่งสำหรับคุณ`, 'success');
}

// ─── Search Logic ─────────────────────────────────────────────────────────────
const searchInput    = document.getElementById('searchInput');
const searchClear    = document.getElementById('searchClear');
const searchDropdown = document.getElementById('searchDropdown');
let searchTimer;

function hideDropdown() {
  searchDropdown.style.display = 'none';
}

function showSearchResults(query) {
  const { buildings, parkingLots } = RecommendationEngine.searchParkingAndBuildings(query);

  if (buildings.length === 0 && parkingLots.length === 0) {
    searchDropdown.innerHTML = `<div class="search-no-results">ไม่พบผลการค้นหาสำหรับ "<b>${query}</b>"</div>`;
    searchDropdown.style.display = 'block';
    return;
  }

  searchDropdown.innerHTML = '';

  if (parkingLots.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'search-dropdown-section';
    sec.innerHTML = '<div class="search-dropdown-label">🅿️ ลานจอดรถ</div>';
    parkingLots.forEach(lot => {
      const row = ParkingCard.createSearchRow(lot, 'parking');
      row.addEventListener('click', () => {
        hideDropdown();
        searchInput.value = '';
        searchClear.classList.remove('show');
        highlightLot(lot);
      });
      sec.appendChild(row);
    });
    searchDropdown.appendChild(sec);
  }

  if (buildings.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'search-dropdown-section';
    sec.innerHTML = '<div class="search-dropdown-label">🏛️ อาคาร</div>';
    buildings.forEach(bldg => {
      const row = ParkingCard.createSearchRow(bldg, 'building');
      row.addEventListener('click', () => {
        hideDropdown();
        searchInput.value = '';
        searchClear.classList.remove('show');
        highlightNearBuilding(bldg);
      });
      sec.appendChild(row);
    });
    searchDropdown.appendChild(sec);
  }

  searchDropdown.style.display = 'block';
}

function highlightLot(lot) {
  // Scroll to cards grid and animate target card
  const grid = document.getElementById('cardsGrid');
  grid.style.display = 'grid';
  grid.innerHTML = '';
  // Show single lot with extra context
  const enriched = { ...lot, distanceText: '—', distanceMetres: 0 };
  grid.appendChild(ParkingCard.create(enriched, 0, false));
  document.getElementById('allLotsSection').style.display = 'none';
  document.getElementById('recReason').textContent = `แสดงผลการค้นหา: "${lot.name}"`;
  document.getElementById('recReasonBox').style.display = 'flex';
  grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  showToast(`🔍 พบ: ${lot.name}`, 'info');
}

async function highlightNearBuilding(bldg) {
  showToast(`🏛️ ค้นหาที่จอดรถใกล้ ${bldg.name}...`, 'info');
  const lots = RecommendationEngine.rankParkingByDistance(bldg.lat, bldg.lng, WU_PARKING_LOTS, 3);

  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  lots.forEach((lot, i) => grid.appendChild(ParkingCard.create(lot, i + 1, true)));
  grid.style.display = 'grid';

  document.getElementById('recReason').textContent = `แสดงที่จอดรถที่ใกล้ "${bldg.name}" ที่สุด 3 อันดับแรก`;
  document.getElementById('recReasonBox').style.display = 'flex';
  grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
  showToast(`✅ พบที่จอดรถใกล้ ${bldg.name} จำนวน ${lots.length} แห่ง`, 'success');
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.classList.toggle('show', q.length > 0);
  clearTimeout(searchTimer);
  if (q.length < 1) { hideDropdown(); return; }
  searchTimer = setTimeout(() => showSearchResults(q), 200);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('show');
  hideDropdown();
  // Reload original recommendations
  loadRecommendations();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrap')) hideDropdown();
});

// ─── Logout ───────────────────────────────────────────────────────────────────
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await authService.logout();
  showToast('ออกจากระบบเรียบร้อยแล้ว', 'default');
  setTimeout(() => { window.location.href = './login.html'; }, 500);
});

// ─── Auto-Update Engine (1 Minute Interval) ───────────────────────────────────
function performAutoUpdate(isManual = false) {
  const result = window.parkingPredictionApi.updateParkingDataAndPredictions();
  const lastTimeEl = document.getElementById('lastUpdatedTime');
  if (lastTimeEl) lastTimeEl.textContent = result.lastUpdated;

  loadRecommendations();

  if (isManual) {
    showToast(`🔄 อัปเดตข้อมูลเซนเซอร์ที่จอดรถและ Prediction เรียบร้อยแล้ว (${result.lastUpdated})`, 'info');
  }
}

document.getElementById('manualRefreshBtn').addEventListener('click', () => {
  performAutoUpdate(true);
});

// Auto refresh every 60 seconds (60,000 ms) without page reload
setInterval(() => {
  performAutoUpdate(false);
}, 60000);

// ─── Init ─────────────────────────────────────────────────────────────────────
(async function init() {
  const roleNames = { student:'นักศึกษา', staff:'บุคลากร/อาจารย์', guest:'บุคคลภายนอก' };
  showToast(`${roleCfg.emoji} ยินดีต้อนรับ ${user.name} (${roleNames[user.role] || ''})`, 'success');
  const initialTime = window.parkingPredictionApi.getLastUpdatedTime();
  const lastTimeEl = document.getElementById('lastUpdatedTime');
  if (lastTimeEl) lastTimeEl.textContent = initialTime;
  await loadRecommendations();
})();
</script>
</body>
</html>
